<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập quản trị | Xưởng In Nhỏ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/dangnhap.css">
</head>

<body>

    <main class="login-page">

        <section class="login-box">

            <!-- LOGO -->
            <div class="login-logo">
                XƯỞNG IN NHỎ
            </div>

            <div class="login-label">
                ADMIN PANEL
            </div>

            <h1>
                ĐĂNG NHẬP
            </h1>

            <p class="login-description">
                Đăng nhập tài khoản quản trị để quản lý sản phẩm.
            </p>


            <!-- FORM -->
            <form id="loginForm">

                <!-- EMAIL -->
                <div class="form-group">

                    <label for="email">
                        EMAIL
                    </label>

                    <input type="email" id="email" name="email" placeholder="Nhập email" autocomplete="email" required>

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="password">
                        MẬT KHẨU
                    </label>

                    <div class="password-wrapper">

                        <input type="password" id="password" name="password" placeholder="Nhập mật khẩu"
                            autocomplete="current-password" required>

                        <button type="button" id="togglePassword" class="toggle-password">
                            HIỆN
                        </button>

                    </div>

                </div>


                <!-- MESSAGE -->
                <div id="loginMessage" class="login-message"></div>


                <!-- LOGIN BUTTON -->
                <button type="submit" id="loginButton" class="login-button">
                    ĐĂNG NHẬP →
                </button>

            </form>


            <!-- BACK -->
            <a href="index.html" class="back-home">
                ← QUAY VỀ TRANG CHỦ
            </a>

        </section>

    </main>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="JavaScript/dangnhap.js"></script>

</body>

</html>
